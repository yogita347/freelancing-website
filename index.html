return`<div class="w sec"><h2>Admin dashboard</h2><div class=g style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${stat('graduation-cap','Total students',S.length)}${stat('building-2','Total clients',C.length)}${stat('briefcase','Total jobs',db.jobs.length)}${stat('loader','Active projects',db.jobs.filter(j=>j.status=='active').length)}${stat('check-circle-2','Completed projects',db.jobs.filter(j=>j.status=='done').length)}${stat('flag','Open reports',db.reports.filter(r=>r.status=='open').length)}</div>
<div class=c style="margin-top:24px"><h3>Platform statistics: jobs by category</h3>${cats.map(c=>{const n=db.jobs.filter(j=>j.cat==c[0]).length;return`<div class=rw style="border:0;padding:5px 0"><span style="width:130px">${c[0]}</span><div class=bar style="flex:1"><i style="width:${n/mx*100}%"></i></div><b>${n}</b></div>`}).join('')}</div>
<div class=c style="margin-top:24px"><h3>User management</h3><div class=tbl><table><tr><th>Name<th>Email<th>Role<th></tr>${db.users.filter(u=>u.role!='admin').map(u=>`<tr><td>${e(u.name)}<td>${e(u.email)}<td><span class=tag>${u.role}</span><td><button class="b bo sm" onclick="du('${u.id}')">Delete</button></tr>`).join('')}</table></div></div>
<div class=c style="margin-top:24px"><h3>Job management</h3><div class=tbl><table><tr><th>Title<th>Client<th>Budget<th>Status<th></tr>${db.jobs.map(j=>`<tr><td>${e(j.title)}<td>${e(U(j.client)?.company)}<td>${inr(j.budget)}<td><span class="pill ${j.status}">${j.status}</span><td><button class="b bo sm" onclick="dj_('${j.id}')">Delete</button></tr>`).join('')}</table></div></div>
<div class=c style="margin-top:24px"><h3>Report management</h3><div class=tbl><table><tr><th>Job<th>Reported by<th>Reason<th>Status<th></tr>${db.reports.map(r=>`<tr><td>${e(J(r.job)?.title||'Deleted job')}<td>${e(U(r.by)?.name)}<td>${e(r.reason)}<td><span class="pill ${r.status=='open'?'':'done'}">${r.status}</span><td>${r.status=='open'?`<button class="b bp sm" onclick="rr('${r.id}')">Resolve</button>`:''}</tr>`).join('')||'<tr><td>No reports</tr>'}</table></div></div></div>`}
function du(i){if(!confirm('Delete this user and their data?'))return;const js=db.jobs.filter(j=>j.client==i).map(j=>j.id);db.jobs=db.jobs.filter(j=>j.client!=i);db.apps=db.apps.filter(a=>a.student!=i&&!js.includes(a.job));db.users=db.users.filter(u=>u.id!=i);save();toast('User deleted');R(1)}
const rr=i=>{db.reports.find(r=>r.id==i).status='resolved';save();toast('Report resolved');R(1)};

/* ---------- CHATBOT ---------- */
let chatHistory=[],chatState='start';
const chatbot={
  welcome:()=>'Hi! 👋 I\'m your Job Match Assistant. I analyze your resume and skills to find the perfect freelance jobs for you. Ready to get started?',
  askName:()=>'What\'s your name?',
  askLevel:()=>'What\'s your experience level?',
  askCategory:()=>'Which area interests you most?',
  askBudget:()=>'What\'s your minimum budget per project (in ₹)?',
  analyze:(p)=>{if(!p)return 'Please log in as a student to analyze your profile.';const sk=p.skills||[],cat=cats.find(c=>db.jobs.filter(j=>j.cat==c[0]&&j.skills.some(s=>sk.includes(s))).length>0)?.[0];
    const lvl=p.skills.length>=5?'Advanced':p.skills.length>=3?'Intermediate':'Beginner';const rec=db.jobs.filter(j=>j.status=='open'&&j.skills.some(s=>sk.includes(s))).sort((a,b)=>b.skills.filter(s=>sk.includes(s)).length-a.skills.filter(s=>sk.includes(s)).length).slice(0,4);
    return rec.length?`Great! Based on your profile (${lvl} level, ${sk.length} skills), I found ${rec.length} perfect jobs for you:\n\n${rec.map(j=>`• ${j.title} (${inr(j.budget)})`).join('\n')}`:'No matching jobs found right now. Try exploring new skills!'},
  suggest:(sk)=>{const rec=db.jobs.filter(j=>j.status=='open'&&sk.some(s=>j.skills.some(k=>k.toLowerCase().includes(s.toLowerCase())))).slice(0,3);
    return rec.length?`I found ${rec.length} jobs that match your skills:\n\n${rec.map(j=>`• **${j.title}** - ${inr(j.budget)}\n   Skills: ${j.skills.slice(0,3).join(', ')}`).join('\n\n')}`:' No matching jobs. Try different skills!'}
};
function addMsg(t,b=false){const m=document.createElement('div');m.className='chat-msg '+(b?'bot':'user');const d=document.createElement('div');d.className='chat-text';d.innerHTML=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');m.append(d);$('#chat-messages').append(m);$('#chat-messages').scrollTop=$('#chat-messages').scrollHeight}
function addSuggestions(opts){const d=document.createElement('div');d.className='chat-suggestions';opts.forEach(o=>{const b=document.createElement('button');b.className='chat-sugg';b.textContent=o;b.onclick=()=>{addMsg(o);chatReply(o)};d.append(b)});$('#chat-messages').append(d);$('#chat-messages').scrollTop=$('#chat-messages').scrollHeight}
function chatReply(msg){msg=msg.trim().toLowerCase();const u=me;
if(chatState=='start'){chatState='menu';addMsg(chatbot.welcome(),true);addSuggestions(u?['Analyze my profile','Browse jobs by skill','Find beginner projects','Find high-paying jobs']:[' Log in to analyze profile','Browse jobs','Learn about the platform'])}
else if(chatState=='menu'){if(msg.includes('analyz')||msg.includes('profile')){if(!u){addMsg('You need to log in as a student first to analyze your profile.',true);addMsg('Would you like to log in?',true);addSuggestions(['Log in','Cancel'])}else{const r=chatbot.analyze(u);addMsg(r,true);addMsg('Would you like to apply to any of these jobs?',true);addSuggestions(['Show details','Back to menu','Change filters'])}}
else if(msg.includes('log in')){addMsg('Redirecting to login page...',true);setTimeout(()=>{go('#/login');ccm()},500)}
else if(msg.includes('browse')||msg.includes('skill')){if(!u){addMsg('Please log in first.',true);return}addMsg('Tell me your main skills (e.g., React, Python, Figma)',true);chatState='askSkills'}
else if(msg.includes('beginner')){const b=db.jobs.filter(j=>j.status=='open'&&j.level=='Beginner').slice(0,4);addMsg(`Found ${b.length} beginner jobs:\n\n${b.map(j=>`• ${j.title} - ${inr(j.budget)}`).join('\n')}`,true);addSuggestions(['Show more','Back to menu','Apply now'])}
else if(msg.includes('high-pay')||msg.includes('high pay')){const b=db.jobs.filter(j=>j.status=='open').sort((a,b)=>b.budget-a.budget).slice(0,4);addMsg(`Here are the highest-paying jobs:\n\n${b.map(j=>`• ${j.title} - ${inr(j.budget)}`).join('\n')}`,true);addSuggestions(['Browse jobs','Back to menu','Apply now'])}
else if(msg.includes('back')){chatState='menu';addMsg('What would you like to do?',true);addSuggestions(['Analyze my profile','Browse jobs by skill','Find beginner projects','Find high-paying jobs'])}}
else if(chatState=='askSkills'){const sk=msg.split(/[,\s]+/).filter(s=>s.length>2);if(sk.length){const r=chatbot.suggest(sk);addMsg(r,true);addMsg('Want to apply to any of these?',true);addSuggestions(['Show more','Browse by category','Back to menu'])}else addMsg('Please tell me your main skills.',true)}}
function ocb(){$('#chatbox').style.display='flex';$('#chat-messages').innerHTML='';chatHistory=[];chatState='start';addMsg(chatbot.welcome(),true);addSuggestions(me?['Analyze my profile','Browse jobs by skill','Find beginner projects','Find high-paying jobs']:['Log in to analyze','Browse all jobs','Learn about platform']);setTimeout(()=>lucide.createIcons(),50)}
function ccm(){$('#chatbox').style.display='none'}
$('#chatbot-btn').onclick=()=>$('#chatbox').style.display=='none'?ocb():ccm();
$('#close-chat').onclick=ccm;
$('#chat-send').onclick=()=>{const t=$('#chat-input').value.trim();if(!t)return;addMsg(t);$('#chat-input').value='';chatReply(t);setTimeout(()=>lucide.createIcons(),50)};
$('#chat-input').onkeypress=ev=>{if(ev.key=='Enter')$('#chat-send').click()};

(async()=>{try{db=JSON.parse(LS.g('sf3'))}catch(_){}if(!db||!db.users){await seed();save()}const s=LS.g('sf3s');me=s&&U(s)||null;addEventListener('hashchange',()=>R());R();lucide.createIcons()})();
</script></body>
</html>
